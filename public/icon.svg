<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08" />

  <!-- Sound Waves (Left & Right) -->
  <path d="M 130 200 C 110 230 110 280 130 310" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 90 170 C 60 220 60 290 90 340" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.5" />
  <path d="M 382 200 C 402 230 402 280 382 310" stroke="#f59e0b" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 422 170 C 452 220 452 290 422 340" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Main Alarm Bell (with shadow) -->
  <g filter="url(#shadow)">
    <!-- Bell Top Loop -->
    <path d="M 232 144 C 232 130 242 120 256 120 C 270 120 280 130 280 144" stroke="#ffffff" stroke-width="24" stroke-linecap="round" fill="none" />
    <!-- Bell Body -->
    <path d="M 180 310 C 180 230 200 170 256 170 C 312 170 332 230 332 310 C 342 320 356 332 356 344 C 356 352 350 356 340 356 L 172 356 C 162 356 156 352 156 344 C 156 332 170 320 180 310 Z" fill="url(#bellGrad)" />
    <!-- Bell Clapper -->
    <path d="M 228 356 C 228 376 240 392 256 392 C 272 392 284 376 284 356 Z" fill="url(#accentGrad)" />
    <!-- Alarm Pulse Badge (Bottom right) -->
    <circle cx="330" cy="310" r="24" fill="#ef4444" stroke="#ffffff" stroke-width="6" />
    <path d="M 324 302 L 336 314 M 336 302 L 324 314" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
